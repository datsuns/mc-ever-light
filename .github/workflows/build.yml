name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload NeoForge Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverLight-NeoForge-1.21.4
          path: neoforge/build/libs/*.jar

      - name: Upload Fabric Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverLight-Fabric-1.21.4
          path: fabric/build/libs/*.jar
